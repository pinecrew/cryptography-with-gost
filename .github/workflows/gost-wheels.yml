# Сборка и проверка колёс cryptography-with-gost (см. gost/README.md).
# Отдельный файл, чтобы не создавать конфликтов с workflow upstream при rebase.
name: GOST wheels

on:
  push:
    branches:
      - 'gost/**'
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, runner: ubuntu-latest }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-14 }
          - { name: macos-x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Имя дистрибутива, описание и (для тега v<версия>) версия выпуска.
      - name: Stage pyproject.toml
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              gost/stage.sh "${GITHUB_REF_NAME#v}"
          else
              gost/stage.sh
          fi

      - name: Build and test wheels
        run: |
          python -m pip install cibuildwheel==4.3.1
          python -m cibuildwheel --config-file gost/cibuildwheel.toml --output-dir wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
